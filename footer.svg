<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="T" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F4046"/><stop offset="1" stop-color="#092832"/></linearGradient></defs>
  <style>
    .float{animation:float 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
    .t{animation:rise 1.4s ease-out both}
    .t2{animation:rise 1.4s ease-out .25s both}
    .t3{animation:rise 1.4s ease-out .5s both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
</style>
  <rect width="1000" height="170" rx="12" fill="url(#bg)"/>
  <g transform="translate(50,40)"><g class="float" style="animation-duration:4.0s;animation-delay:-0.0s"><g class="spin" style="animation-duration:10s;animation-delay:-0.0s"><rect x="-11.0" y="-3.6666666666666665" width="22" height="7.333333333333333" rx="2" fill="#E86AB0"/><rect x="-3.6666666666666665" y="-11.0" width="7.333333333333333" height="22" rx="2" fill="#E86AB0"/></g></g></g>
  <g transform="translate(120,100)"><g class="float" style="animation-duration:4.9s;animation-delay:-0.7s"><g class="pulse" style="animation-duration:4s;animation-delay:-1.3s"><circle r="12.0" fill="none" stroke="#F5C518" stroke-width="4.8"/></g></g></g>
  <g transform="translate(60,130)"><g class="float" style="animation-duration:5.8s;animation-delay:-1.4s"><g class="spin" style="animation-duration:16s;animation-delay:-2.6s"><polygon points="13.0,0.0 6.5,11.3 -6.5,11.3 -13.0,0.0 -6.5,-11.3 6.5,-11.3" fill="none" stroke="#34D399" stroke-width="5.2" stroke-linejoin="round"/></g></g></g>
  <g transform="translate(180,45)"><g class="float" style="animation-duration:6.7s;animation-delay:-2.1s"><g class="pulse" style="animation-duration:3s;animation-delay:-3.9s"><circle r="7.0" fill="#4F8CFF"/></g></g></g>
  <g transform="translate(215,130)"><g class="float" style="animation-duration:4.0s;animation-delay:-2.8s"><g class="spin" style="animation-duration:22s;animation-delay:-5.2s"><polygon points="0,-11.0 11.0,11.0 -11.0,11.0" fill="none" stroke="#FB923C" stroke-width="4.4" stroke-linejoin="round"/></g></g></g>
  <g transform="translate(950,40)"><g class="float" style="animation-duration:4.9s;animation-delay:-3.5s"><g class="spin" style="animation-duration:10s;animation-delay:-6.5s"><rect x="-11.0" y="-3.6666666666666665" width="22" height="7.333333333333333" rx="2" fill="#F5C518"/><rect x="-3.6666666666666665" y="-11.0" width="7.333333333333333" height="22" rx="2" fill="#F5C518"/></g></g></g>
  <g transform="translate(880,100)"><g class="float" style="animation-duration:5.8s;animation-delay:-4.2s"><g class="pulse" style="animation-duration:3s;animation-delay:-7.8s"><circle r="12.0" fill="none" stroke="#E86AB0" stroke-width="4.8"/></g></g></g>
  <g transform="translate(940,130)"><g class="float" style="animation-duration:6.7s;animation-delay:-4.9s"><g class="spin" style="animation-duration:16s;animation-delay:-9.1s"><polygon points="13.0,0.0 6.5,11.3 -6.5,11.3 -13.0,0.0 -6.5,-11.3 6.5,-11.3" fill="none" stroke="#4F8CFF" stroke-width="5.2" stroke-linejoin="round"/></g></g></g>
  <g transform="translate(820,45)"><g class="float" style="animation-duration:4.0s;animation-delay:-5.6s"><g class="pulse" style="animation-duration:5s;animation-delay:-10.4s"><circle r="7.0" fill="#34D399"/></g></g></g>
  <g transform="translate(785,132)"><g class="float" style="animation-duration:4.9s;animation-delay:-6.3s"><g class="spin" style="animation-duration:22s;animation-delay:-11.7s"><rect x="-10.0" y="-10.0" width="20" height="20" rx="3" fill="none" stroke="#A78BFA" stroke-width="4.0"/></g></g></g>
  <text class="t" x="500" y="88" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="3" fill="#FFFFFF">THANKS FOR VISITING</text>
  <text class="t2" x="500" y="126" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="3" fill="#5EEAD4">OPEN TO WORK  ·  LET'S BUILD SOMETHING AMAZING</text>
</svg>
